<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title"><title id="title">Техническая схема причин и действий</title><rect width="960" height="540" fill="#101D26"/><text x="58" y="68" fill="white" font-family="Arial" font-size="27" font-weight="700">Инцидент 024: причины и действия</text><text x="58" y="100" fill="#90A8B8" font-family="Arial" font-size="15">ТЕХНИЧЕСКИЙ РАЗБОР</text><g font-family="Arial"><rect x="58" y="145" width="220" height="260" rx="6" fill="#172B38" stroke="#365160"/><text x="82" y="183" fill="#F4A62A" font-size="14">СИМПТОМ</text><text x="82" y="232" fill="white" font-size="22" font-weight="700">Задержка</text><text x="82" y="264" fill="white" font-size="22" font-weight="700">обработки</text><text x="82" y="330" fill="#90A8B8" font-size="16">+42% к времени</text><rect x="370" y="145" width="220" height="260" rx="6" fill="#172B38" stroke="#365160"/><text x="394" y="183" fill="#F4A62A" font-size="14">ПРИЧИНА</text><text x="394" y="232" fill="white" font-size="22" font-weight="700">Очередь</text><text x="394" y="264" fill="white" font-size="22" font-weight="700">перегружена</text><text x="394" y="330" fill="#90A8B8" font-size="16">подтверждено</text><rect x="682" y="145" width="220" height="260" rx="6" fill="#17382F" stroke="#2F725E"/><text x="706" y="183" fill="#66D4A8" font-size="14">ДЕЙСТВИЕ</text><text x="706" y="232" fill="white" font-size="22" font-weight="700">Разделить</text><text x="706" y="264" fill="white" font-size="22" font-weight="700">потоки</text><text x="706" y="330" fill="#90D8BD" font-size="16">до 18 июля</text><path d="M292 275h62M604 275h62" stroke="#90A8B8" stroke-width="3" stroke-dasharray="7 7"/></g></svg>
