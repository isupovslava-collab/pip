<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title"><title id="title">Таблица сравнения бюджетных сценариев и карта рисков</title><rect width="960" height="540" fill="#fff"/><rect x="0" width="18" height="540" fill="#F4A62A"/><text x="58" y="70" fill="#0B2D4D" font-family="Arial" font-size="30" font-weight="700">Бюджетные сценарии</text><text x="58" y="104" fill="#607080" font-family="Arial" font-size="16">Сравнение эффекта, стоимости и рисков</text><rect x="58" y="140" width="555" height="326" rx="8" fill="#F6F8FB"/><rect x="58" y="140" width="555" height="52" fill="#0B2D4D"/><g font-family="Arial" font-size="15"><text x="83" y="172" fill="white">Критерий</text><text x="285" y="172" fill="white">Базовый</text><text x="445" y="172" fill="white">Ускоренный</text><g fill="#17202A"><text x="83" y="232">Инвестиции</text><text x="285" y="232">18,2</text><text x="445" y="232">24,8</text><text x="83" y="298">Эффект</text><text x="285" y="298">+11%</text><text x="445" y="298">+18%</text><text x="83" y="364">Срок</text><text x="285" y="364">18 мес.</text><text x="445" y="364">11 мес.</text><text x="83" y="430">Риск</text><text x="285" y="430">Низкий</text><text x="445" y="430">Средний</text></g></g><rect x="652" y="140" width="250" height="326" rx="8" fill="#0B2D4D"/><text x="682" y="184" fill="white" font-family="Arial" font-size="19" font-weight="700">Карта рисков</text><rect x="682" y="220" width="82" height="82" fill="#7DC3EA"/><rect x="774" y="220" width="98" height="82" fill="#F4A62A"/><rect x="682" y="312" width="82" height="112" fill="#277FAF"/><rect x="774" y="312" width="98" height="112" fill="#E76F51"/></svg>
