<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title"><title id="title">Управленческий слайд с бюджетом и ключевыми показателями</title><rect width="960" height="540" fill="#F6F8FB"/><rect width="960" height="68" fill="#0B2D4D"/><text x="56" y="43" fill="white" font-family="Arial" font-size="23" font-weight="700">Решение по бюджету</text><text x="60" y="142" fill="#607080" font-family="Arial" font-size="18">ТРЕБУЕМОЕ РЕШЕНИЕ</text><text x="58" y="229" fill="#0B2D4D" font-family="Arial" font-size="72" font-weight="700">24,8 млн ₽</text><rect x="58" y="272" width="392" height="154" rx="14" fill="white" stroke="#DDE4EC"/><text x="84" y="317" fill="#607080" font-family="Arial" font-size="16">ОЖИДАЕМЫЙ ЭФФЕКТ</text><text x="84" y="380" fill="#0A78C2" font-family="Arial" font-size="40" font-weight="700">+18%</text><rect x="490" y="118" width="412" height="308" rx="14" fill="white" stroke="#DDE4EC"/><circle cx="535" cy="178" r="12" fill="#F4A62A"/><text x="565" y="185" fill="#17202A" font-family="Arial" font-size="19">Окупаемость — 11 месяцев</text><circle cx="535" cy="245" r="12" fill="#0A78C2"/><text x="565" y="252" fill="#17202A" font-family="Arial" font-size="19">3 ключевых результата</text><circle cx="535" cy="312" r="12" fill="#0B2D4D"/><text x="565" y="319" fill="#17202A" font-family="Arial" font-size="19">Риски учтены в расчете</text><rect x="520" y="352" width="330" height="44" rx="6" fill="#0B2D4D"/><text x="685" y="380" text-anchor="middle" fill="white" font-family="Arial" font-size="17">Рекомендуется одобрить</text></svg>
