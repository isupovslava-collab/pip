<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title"><title id="title">Процесс перехода от проблемы к решению</title><rect width="960" height="540" fill="#F6F8FB"/><rect x="48" y="45" width="864" height="450" rx="18" fill="white" stroke="#DDE4EC"/><text x="82" y="96" fill="#0B2D4D" font-family="Arial" font-size="27" font-weight="700">От проблемы к решению за 30 минут</text><g font-family="Arial"><rect x="82" y="148" width="210" height="248" rx="14" fill="#FCEBE7"/><text x="106" y="187" fill="#B84B36" font-size="14">01 / ПРОБЛЕМА</text><text x="106" y="243" fill="#17202A" font-size="22" font-weight="700">Где мы</text><text x="106" y="273" fill="#17202A" font-size="22" font-weight="700">теряем темп?</text><rect x="375" y="148" width="210" height="248" rx="14" fill="#E9F4FA"/><text x="399" y="187" fill="#0A78C2" font-size="14">02 / ВАРИАНТЫ</text><text x="399" y="243" fill="#17202A" font-size="22" font-weight="700">Что можно</text><text x="399" y="273" fill="#17202A" font-size="22" font-weight="700">изменить?</text><rect x="668" y="148" width="210" height="248" rx="14" fill="#EAF5EF"/><text x="692" y="187" fill="#23865B" font-size="14">03 / РЕШЕНИЕ</text><text x="692" y="243" fill="#17202A" font-size="22" font-weight="700">Что делаем</text><text x="692" y="273" fill="#17202A" font-size="22" font-weight="700">сегодня?</text><path d="M307 272h48" stroke="#607080" stroke-width="3"/><path d="m345 262 12 10-12 10" fill="none" stroke="#607080" stroke-width="3"/><path d="M600 272h48" stroke="#607080" stroke-width="3"/><path d="m638 262 12 10-12 10" fill="none" stroke="#607080" stroke-width="3"/></g></svg>
