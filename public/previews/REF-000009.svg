<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title"><title id="title">История корпоративных изменений</title><rect width="960" height="540" fill="#0B2D4D"/><circle cx="790" cy="160" r="250" fill="#0A78C2" opacity=".35"/><circle cx="840" cy="90" r="135" fill="#F4A62A" opacity=".9"/><path d="M0 490C220 350 320 565 520 410s280-30 440-120v250H0Z" fill="#fff" opacity=".07"/><text x="76" y="175" fill="#F4A62A" font-family="Arial" font-size="17" letter-spacing="2">ИСТОРИЯ ИЗМЕНЕНИЙ</text><text x="72" y="244" fill="white" font-family="Arial" font-size="48" font-weight="700">Мы меняемся,</text><text x="72" y="301" fill="white" font-family="Arial" font-size="48" font-weight="700">чтобы двигаться</text><text x="72" y="358" fill="white" font-family="Arial" font-size="48" font-weight="700">дальше</text><rect x="76" y="403" width="90" height="5" fill="#F4A62A"/><text x="76" y="450" fill="#C8D9E7" font-family="Arial" font-size="18">Один смысл. Одна команда. Новый этап.</text></svg>
