<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title"><title id="title">Бизнес-логика защиты проекта</title><rect width="960" height="540" fill="#fff"/><rect width="320" height="540" fill="#0B2D4D"/><text x="52" y="76" fill="white" font-family="Arial" font-size="28" font-weight="700">Проект создаст</text><text x="52" y="112" fill="white" font-family="Arial" font-size="28" font-weight="700">новую ценность</text><text x="52" y="220" fill="#F4A62A" font-family="Arial" font-size="62" font-weight="700">3,2×</text><text x="52" y="253" fill="#C8D9E7" font-family="Arial" font-size="16">возврат инвестиций</text><text x="372" y="72" fill="#0B2D4D" font-family="Arial" font-size="24" font-weight="700">Логика решения</text><g font-family="Arial"><rect x="372" y="120" width="520" height="72" rx="10" fill="#F6F8FB" stroke="#DDE4EC"/><text x="402" y="150" fill="#0A78C2" font-size="14">ПРОБЛЕМА</text><text x="402" y="176" fill="#17202A" font-size="18">Потери растут быстрее выручки</text><rect x="372" y="218" width="520" height="72" rx="10" fill="#F6F8FB" stroke="#DDE4EC"/><text x="402" y="248" fill="#0A78C2" font-size="14">РЕШЕНИЕ</text><text x="402" y="274" fill="#17202A" font-size="18">Автоматизировать ключевой процесс</text><rect x="372" y="316" width="520" height="72" rx="10" fill="#F6F8FB" stroke="#DDE4EC"/><text x="402" y="346" fill="#0A78C2" font-size="14">ЭФФЕКТ</text><text x="402" y="372" fill="#17202A" font-size="18">Снизить потери на 28%</text><rect x="372" y="414" width="520" height="52" rx="10" fill="#F4A62A"/><text x="632" y="447" text-anchor="middle" fill="#0B2D4D" font-size="18" font-weight="700">Решение: запустить проект</text></g></svg>
