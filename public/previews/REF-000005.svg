<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title"><title id="title">Панель ключевых показателей периода</title><rect width="960" height="540" fill="#F6F8FB"/><text x="55" y="65" fill="#0B2D4D" font-family="Arial" font-size="28" font-weight="700">Итоги квартала</text><text x="845" y="65" text-anchor="end" fill="#607080" font-family="Arial" font-size="16">Q2 / 2026</text><g font-family="Arial"><rect x="55" y="105" width="255" height="130" rx="12" fill="white" stroke="#DDE4EC"/><text x="80" y="142" fill="#607080" font-size="15">ВЫРУЧКА</text><text x="80" y="198" fill="#0B2D4D" font-size="42" font-weight="700">184 млн</text><text x="250" y="198" fill="#2C9B69" font-size="16">▲ 12%</text><rect x="330" y="105" width="255" height="130" rx="12" fill="white" stroke="#DDE4EC"/><text x="355" y="142" fill="#607080" font-size="15">МАРЖА</text><text x="355" y="198" fill="#0B2D4D" font-size="42" font-weight="700">31%</text><text x="525" y="198" fill="#2C9B69" font-size="16">▲ 3 п.п.</text><rect x="605" y="105" width="300" height="130" rx="12" fill="#0B2D4D"/><text x="630" y="142" fill="#C8D9E7" font-size="15">ВЫПОЛНЕНИЕ ПЛАНА</text><text x="630" y="198" fill="white" font-size="42" font-weight="700">104%</text><rect x="55" y="260" width="530" height="215" rx="12" fill="white" stroke="#DDE4EC"/><polyline points="90,414 160,385 230,401 300,336 370,350 440,292 545,312" fill="none" stroke="#0A78C2" stroke-width="6"/><line x1="90" y1="432" x2="545" y2="432" stroke="#DDE4EC"/><rect x="605" y="260" width="300" height="215" rx="12" fill="white" stroke="#DDE4EC"/><text x="635" y="301" fill="#0B2D4D" font-size="19" font-weight="700">Главный вывод</text><text x="635" y="341" fill="#17202A" font-size="16">Рост выше плана,</text><text x="635" y="369" fill="#17202A" font-size="16">качество портфеля</text><text x="635" y="397" fill="#17202A" font-size="16">сохраняется.</text></g></svg>
