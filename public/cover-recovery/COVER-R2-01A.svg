    <circle cx="1110" cy="385" r="390" fill="url(#sun)" filter="url(#soft)"/>
    <path d="M620 700C790 580 915 610 1050 540C1190 468 1340 478 1635 315V900H620Z" fill="#354C59" opacity=".64"/>
    <path d="M625 790C840 628 1020 714 1220 585C1362 494 1488 500 1630 455V900H625Z" fill="url(#land)"/>
