    <linearGradient id="beam" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#06122F" stop-opacity="0"/><stop offset=".48" stop-color="#7EE8FF" stop-opacity=".08"/><stop offset=".78" stop-color="#D8F9FF" stop-opacity=".4"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".8"/></linearGradient>
